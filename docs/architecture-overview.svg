<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <style>
    .box { fill: rgba(127,127,127,0.06); stroke: #8b949e; stroke-width: 1.4; }
    .title { font-size: 14px; font-weight: 600; text-anchor: middle; fill: #1f2328; }
    .subtitle { font-size: 12px; text-anchor: middle; fill: #57606a; }
    .desc { font-size: 11.5px; text-anchor: middle; fill: #57606a; }
    .arrow { stroke: #8b949e; stroke-width: 1.4; fill: none; }
    .arrow-label { font-size: 11px; text-anchor: middle; fill: #57606a; font-style: italic; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #e6edf3; }
      .subtitle, .desc, .arrow-label { fill: #9da7b3; }
    }
  </style>

  <defs>
    <marker id="end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8b949e"/>
    </marker>
    <marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M10,0 L0,5 L10,10 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Slack workspace box -->
  <rect class="box" x="150" y="20" width="600" height="84" rx="8"/>
  <text class="title" x="450" y="46">💬 Slack workspace</text>
  <text class="subtitle" x="450" y="68">👤 Alice · 👤 Bob · 👤 Carol — many people @mention the same bot</text>
  <text class="subtitle" x="450" y="86">every event carries the Slack user who triggered it</text>

  <!-- Arrow Slack ↔ Relay -->
  <line class="arrow" x1="450" y1="109" x2="450" y2="199" marker-start="url(#start)" marker-end="url(#end)"/>
  <text class="arrow-label" x="525" y="158">events · replies</text>

  <!-- Relay server box -->
  <rect class="box" x="150" y="204" width="600" height="96" rx="8"/>
  <text class="title" x="450" y="230">☁️ Multi-tenant relay server</text>
  <text class="subtitle" x="450" y="252">knows which laptop is paired to each Slack user</text>
  <text class="subtitle" x="450" y="270">forwards each event only to that user's laptop</text>
  <text class="subtitle" x="450" y="290">🔐 every laptop link encrypted &amp; cryptographically authenticated</text>

  <!-- Three arrows down to clients -->
  <line class="arrow" x1="350" y1="303" x2="150" y2="362" marker-start="url(#start)" marker-end="url(#end)"/>
  <line class="arrow" x1="450" y1="303" x2="450" y2="362" marker-start="url(#start)" marker-end="url(#end)"/>
  <line class="arrow" x1="550" y1="303" x2="750" y2="362" marker-start="url(#start)" marker-end="url(#end)"/>

  <!-- Alice's laptop -->
  <rect class="box" x="30" y="365" width="240" height="140" rx="8"/>
  <text class="title" x="150" y="391">💻 Alice's laptop</text>
  <text class="desc" x="150" y="413">client daemon</text>
  <text class="desc" x="150" y="441">🤖 Alice's Claude Code</text>
  <text class="desc" x="150" y="461">(her files, logins,</text>
  <text class="desc" x="150" y="477">MCP servers, skills)</text>

  <!-- Bob's laptop -->
  <rect class="box" x="330" y="365" width="240" height="140" rx="8"/>
  <text class="title" x="450" y="391">💻 Bob's laptop</text>
  <text class="desc" x="450" y="413">client daemon</text>
  <text class="desc" x="450" y="441">🤖 Bob's Claude Code</text>
  <text class="desc" x="450" y="461">(his files, logins,</text>
  <text class="desc" x="450" y="477">MCP servers, skills)</text>

  <!-- Carol's laptop -->
  <rect class="box" x="630" y="365" width="240" height="140" rx="8"/>
  <text class="title" x="750" y="391">💻 Carol's laptop</text>
  <text class="desc" x="750" y="413">client daemon</text>
  <text class="desc" x="750" y="441">🤖 Carol's Claude Code</text>
  <text class="desc" x="750" y="461">(her files, logins,</text>
  <text class="desc" x="750" y="477">MCP servers, skills)</text>
</svg>
