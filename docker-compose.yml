# Local dev stack — single SQLite-backed server.
# One-time bootstrap (on the host):
#   cd server && npx tsx scripts/bootstrap-keypair.ts
# Start:
#   docker compose up
services:
  server:
    image: node:24-trixie-slim
    working_dir: /app
    env_file:
      - ./server/.env
    environment:
      DATABASE_PATH: /app/server/data/claude-slackbot.sqlite
      SERVER_PRIVATE_KEY_PATH: /app/server/data/server-ed25519.key
      SERVER_PUBLIC_KEY_PATH: /app/server/data/server-ed25519.pub
      NODE_ENV: development
    volumes:
      - .:/app
      # Anonymous volumes mask host node_modules (which has mac-arm64 binaries).
      - /app/node_modules
      - /app/server/node_modules
      - /app/client/node_modules
    ports:
      - "127.0.0.1:8443:8443"
    command: >
      sh -c "
      [ -f /app/node_modules/.package-lock.json ] || (echo 'installing deps in container (one-time)...'; npm install) &&
      cd /app/server && exec node --import tsx src/index.ts
      "
