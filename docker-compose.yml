# Local dev stack: Postgres + server (run via tsx with source mounted).
# Bootstrap keypair (one-time, on the host):
#   cd server && npx tsx scripts/bootstrap-keypair.ts
# Start everything:
#   docker compose up
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: claudeslackbot
      POSTGRES_PASSWORD: claudeslackbot
      POSTGRES_DB: claudeslackbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claudeslackbot -d claudeslackbot"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    image: node:20-bookworm-slim
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      # Override host-side .env values for the Docker network.
      DATABASE_URL: postgres://claudeslackbot:claudeslackbot@postgres:5432/claudeslackbot
      SERVER_PRIVATE_KEY_PATH: /app/server/data/server-ed25519.key
      SERVER_PUBLIC_KEY_PATH: /app/server/data/server-ed25519.pub
      NODE_ENV: development
    volumes:
      - .:/app
      # Anonymous volumes mask host node_modules (which has mac-arm64 binaries).
      - /app/node_modules
      - /app/server/node_modules
      - /app/client/node_modules
    ports:
      - "127.0.0.1:8443:8443"
    command: >
      sh -c "
      [ -f /app/node_modules/.package-lock.json ] || (echo 'installing deps in container (one-time)...'; npm install) &&
      cd /app/server && exec node --import tsx src/index.ts
      "

volumes:
  pgdata:
